<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Art - Upcoming English Friendly Screenings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bec-red: #e30613;
            --bec-dark: #333333;
            --bec-gray: #f4f4f4;
            --bec-text: #4a4a4a;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #fff;
            color: var(--bec-text);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            text-align: left;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            color: var(--bec-dark);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .accent-line {
            width: 60px;
            height: 5px;
            background-color: var(--bec-red);
            margin-bottom: 30px;
        }

        /* Interactive Filter */
        .filters {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 18px;
            border: 2px solid var(--bec-gray);
            background: white;
            cursor: pointer;
            font-weight: 600;
            border-radius: 20px;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--bec-red);
            color: white;
            border-color: var(--bec-red);
        }

        /* Event Cards */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .event-card {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
        }

        .event-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--bec-red);
        }

        .event-date {
            min-width: 90px;
            text-align: center;
            border-right: 2px solid var(--bec-gray);
            margin-right: 25px;
            padding-right: 15px;
        }

        .date-day {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--bec-dark);
            line-height: 1;
        }

        .date-month {
            display: block;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--bec-red);
        }

        .event-info {
            flex-grow: 1;
        }

        .event-category {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 4px;
        }

        .event-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            color: var(--bec-dark);
            margin: 0;
            font-weight: 700;
        }

        .btn-tickets {
            background-color: var(--bec-gray);
            color: var(--bec-dark);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .event-card:hover .btn-tickets {
            background-color: var(--bec-red);
            color: white;
        }

        @media (max-width: 600px) {
            .event-card { flex-direction: column; align-items: flex-start; }
            .event-date { border-right: none; border-bottom: 2px solid var(--bec-gray); margin-bottom: 15px; width: 100%; text-align: left; }
            .btn-tickets { margin-top: 15px; display: inline-block; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kino Art Program</h1>
        <div class="accent-line"></div>
        <div class="filters">
            <button class="filter-btn active" onclick="filterEvents('all')">All</button>
            <button class="filter-btn" onclick="filterEvents('February')">February</button>
            <button class="filter-btn" onclick="filterEvents('March')">March</button>
        </div>
    </header>

    <div class="event-list" id="eventList">
        </div>
</div>

<script>
    const events = [
        { title: "Kaprálova", day: "19", month: "February", url: "https://www.kinoart.cz/en/movies/kapralova-2025/2026/02/19/1804" },
        { title: "Mr. Nobody Against Putin", day: "20", month: "February", url: "https://www.kinoart.cz/en/movies/mr-nobody-against-putin-2025/2026/02/20/1745" },
        { title: "The Last Viking", day: "20", month: "February", url: "https://www.kinoart.cz/en/movies/the-last-viking-2025/2026/02/20/1800" },
        { title: "Chungking Express", day: "20", month: "February", url: "https://www.kinoart.cz/en/movies/chungking-express-1994/2026/02/20/2030" },
        { title: "Virtual Girlfriends", day: "22", month: "February", url: "https://www.kinoart.cz/en/movies/virtual-girlfriends-2025/2026/02/22/1804" },
        { title: "Kaprálova", day: "23", month: "February", url: "https://www.kinoart.cz/en/movies/kapralova-2025/2026/02/23/1800" },
        { title: "Once Upon a Time in Ukraine", day: "24", month: "February", url: "https://www.kinoart.cz/en/movies/not-only-four-years-once-upon-a-time-in-ukraine-2024/2026/02/24/1800" },
        { title: "Mr. Nobody Against Putin", day: "25", month: "February", url: "https://www.kinoart.cz/en/movies/mr-nobody-against-putin-2025/2026/02/25/1515" },
        { title: "It Was Just an Accident", day: "25", month: "February", url: "https://www.kinoart.cz/en/movies/it-was-just-an-accident-2025/2026/02/25/2030" },
        { title: "Flood", day: "25", month: "February", url: "https://www.kinoart.cz/en/movies/flood-2025/2026/02/25/1804" },
        { title: "Kaprálova", day: "26", month: "February", url: "https://www.kinoart.cz/en/movies/kapralova-2025/2026/02/26/1515" },
        { title: "The Last Viking", day: "26", month: "February", url: "https://www.kinoart.cz/en/movies/the-last-viking-2025/2026/02/26/1530" },
        { title: "Fallen Angels", day: "26", month: "February", url: "https://www.kinoart.cz/en/movies/fallen-angels-1995/2026/02/26/1800" },
        { title: "Mr. Nobody Against Putin", day: "27", month: "February", url: "https://www.kinoart.cz/en/movies/mr-nobody-against-putin-2025/2026/02/27/1804" },
        { title: "Broken Voices", day: "28", month: "February", url: "https://www.kinoart.cz/en/movies/broken-voices-2025/2026/02/28/1500" },
        { title: "Flood", day: "28", month: "February", url: "https://www.kinoart.cz/en/movies/flood-2025/2026/02/28/1730" },
        { title: "Virtual Girlfriends", day: "28", month: "February", url: "https://www.kinoart.cz/en/movies/virtual-girlfriends-2025/2026/02/28/1804" },
        { title: "Burma’s Peacock Film Festival", day: "01", month: "March", url: "https://www.kinoart.cz/en/programme/burma-s-peacock-film-festival-in-brno/2026/03/01/1700" },
        { title: "Kaprálova", day: "01", month: "March", url: "https://www.kinoart.cz/en/movies/kapralova-2025/2026/03/01/1804" },
        { title: "Démanty noci (Guests)", day: "03", month: "March", url: "https://www.kinoart.cz/en/programme/demanty-noci-projection-with-guests/2026/03/03/1800" },
        { title: "Roblox and the Metaverse", day: "20", month: "March", url: "https://www.kinoart.cz/en/movies/dangerous-games-roblox-and-the-metaverse-exposed-2025/2026/03/20/1800" },
        { title: "The Voice of Hind Rajab", day: "20", month: "March", url: "https://www.kinoart.cz/en/movies/the-voice-of-hind-rajab-2025/2026/03/20/2030" },
        { title: "Dear Tomorrow", day: "22", month: "March", url: "https://www.kinoart.cz/en/movies/dear-tomorrow-2025/2026/03/22/1500" },
        { title: "She", day: "23", month: "March", url: "https://www.kinoart.cz/en/movies/she-2025/2026/03/23/1800" },
        { title: "Carmela and the Walkers", day: "25", month: "March", url: "https://www.kinoart.cz/en/movies/carmela-and-the-walkers-2025/2026/03/25/2030" }
    ];

    function displayEvents(filter) {
        const list = document.getElementById('eventList');
        list.innerHTML = '';
        
        const filtered = filter === 'all' ? events : events.filter(e => e.month === filter);

        filtered.forEach(event => {
            const card = document.createElement('a');
            card.className = 'event-card';
            card.href = event.url;
            card.target = "_blank";
            card.innerHTML = `
                <div class="event-date">
                    <span class="date-day">${event.day}</span>
                    <span class="date-month">${event.month.substring(0,3)}</span>
                </div>
                <div class="event-info">
                    <div class="event-category">Cinema • English Friendly</div>
                    <h2 class="event-title">${event.title}</h2>
                </div>
                <div class="btn-tickets">Tickets</div>
            `;
            list.appendChild(card);
        });
    }

    function filterEvents(month) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText === month || (month === 'all' && btn.innerText === 'All')) btn.classList.add('active');
        });
        displayEvents(month);
    }

    // Initial load
    displayEvents('all');
</script>

</body>
</html>
